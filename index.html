<script>
/* ================= Inicialización ================= */
const sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
const $ = s => document.querySelector(s);
const fmt = n => CONFIG.MONEDA + ' ' + Number(n).toFixed(2);
const esc = s => String(s??'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* Pantalla de carga: logo + nombre de la tienda (elegante). */
(function(){ const l=$('#loader'); if(!l) return;
  const ciudad=CONFIG.CIUDAD?(' '+CONFIG.CIUDAD):'';
  const logo=CONFIG.LOGO_CARGA||CONFIG.LOGO_URL||'';
  const txt=(CONFIG.CARGA_TEXTO || '').trim();
  if(logo){
    l.innerHTML='<div class="loadbrand"><img class="loadlogo" alt="">'
      +'<div class="loadname">'+esc((CONFIG.TIENDA_NOMBRE||'')+ciudad)+'</div>'
      +'<div class="loaddots"><span></span><span></span><span></span></div></div>';
    l.querySelector('.loadlogo').src=logo;
  } else if(txt){
    const w=txt.split(/\s+/); const l1=esc(w.shift()||''); const l2=esc(w.join(' '));
    l.innerHTML='<div class="brandmark"><div class="l1">'+l1+'</div>'+(l2?'<div class="l2">'+l2+'</div>':'')+'<div class="rule"></div></div>';
  } else {
    l.innerHTML='<div class="word">'+esc(CONFIG.TIENDA_NOMBRE||'')+'</div>';
  }
})();

/* Branding desde config */
const _ciudad = CONFIG.CIUDAD ? ' '+CONFIG.CIUDAD : '';
$('#brand').innerHTML = (CONFIG.LOGO_URL ? `<img src="${CONFIG.LOGO_URL}" alt="${esc(CONFIG.TIENDA_NOMBRE)}">` : '') + `<span class="brandtxt">${esc((CONFIG.TIENDA_NOMBRE||'')+_ciudad)}</span>`;
$('#tagline').textContent = CONFIG.TIENDA_TAGLINE || '';
$('#heroTitle').textContent = CONFIG.TIENDA_NOMBRE;
/* Banner de envíos (marquee): BANNER_ENVIO puede ser un texto o una lista de frases */
(function(){ const m=$('#marquee'); if(!m) return;
  let frases = CONFIG.BANNER_ENVIO;
  if(Array.isArray(frases)) frases = frases.map(f=>String(f).trim()).filter(Boolean);
  else { const t=String(frases||CONFIG.ENVIO_TEXTO||'').trim(); frases = t ? [t] : []; }
  if(!frases.length){ m.style.display='none'; return; }
  const seg = frases.map(f=>`<span>${esc(f)}</span><span>◆</span>`).join('');
  const reps = Math.max(2, Math.ceil(8/frases.length));
  m.innerHTML=`<div class="mq-track">${seg.repeat(reps)}</div>`;
})();
if(CONFIG.HERO_SUB) $('#heroSub').textContent = CONFIG.HERO_SUB;
(function(){ const orn=$('#heroOrn'); if(!orn) return;
  const w=(CONFIG.TIENDA_NOMBRE||'').trim().split(/\s+/).filter(Boolean);
  let m=w.length?(w[0].length<=4?w[0]:w.map(x=>x[0]).join('')):'?';
  const mono='<div class="mono gold-text">'+esc(m.toUpperCase().slice(0,4))+'</div>';
  if(CONFIG.LOGO_URL){
    orn.innerHTML='<img alt="'+esc(CONFIG.TIENDA_NOMBRE||'')+'">';
    const im=orn.querySelector('img');
    im.onerror=function(){ orn.innerHTML=mono; };
    im.src=CONFIG.LOGO_URL;
  } else { orn.innerHTML=mono; }
})();
document.title = CONFIG.TIENDA_NOMBRE + ' — Catálogo';

/* Redes sociales */
const ICONS = {
  instagram:'<svg viewBox="0 0 24 24"><path d="M12 2c2.7 0 3 0 4.1.1 1 0 1.6.2 2 .4.5.2.9.5 1.3.9.4.4.7.8.9 1.3.2.4.3 1 .4 2C21 7.8 21 8.1 21 12s0 4.2-.1 5.3c0 1-.2 1.6-.4 2-.2.5-.5.9-.9 1.3-.4.4-.8.7-1.3.9-.4.2-1 .3-2 .4-1.1 0-1.4.1-4.3.1s-4.2 0-5.3-.1c-1 0-1.6-.2-2-.4-.5-.2-.9-.5-1.3-.9-.4-.4-.7-.8-.9-1.3-.2-.4-.3-1-.4-2C3 16.2 3 15.9 3 12s0-4.2.1-5.3c0-1 .2-1.6.4-2 .2-.5.5-.9.9-1.3.4-.4.8-.7 1.3-.9.4-.2 1-.3 2-.4C8.8 2 9.1 2 12 2zm0 5a5 5 0 100 10 5 5 0 000-10zm0 8.2a3.2 3.2 0 110-6.4 3.2 3.2 0 010 6.4zM17.8 5.9a1.2 1.2 0 100 2.4 1.2 1.2 0 000-2.4z"/></svg>',
  facebook:'<svg viewBox="0 0 24 24"><path d="M22 12a10 10 0 10-11.6 9.9v-7H7.9V12h2.5V9.8c0-2.5 1.5-3.9 3.8-3.9 1.1 0 2.2.2 2.2.2v2.4h-1.2c-1.2 0-1.6.8-1.6 1.6V12h2.7l-.4 2.9h-2.3v7A10 10 0 0022 12z"/></svg>',
  tiktok:'<svg viewBox="0 0 24 24"><path d="M16 3c.3 2.1 1.5 3.4 3.6 3.6v2.5c-1.2.1-2.3-.2-3.6-.9v6.1c0 3.8-2.8 5.9-5.7 5.6-2.9-.3-4.5-2.6-4.3-5.1.2-2.6 2.4-4.3 5-4v2.6c-.4-.1-.8-.2-1.2-.1-1 .1-1.7.9-1.6 2 .1 1 .9 1.7 2 1.6 1.1-.1 1.6-1 1.6-2V3H16z"/></svg>',
};
(function(){
  const r = CONFIG.REDES||{};
  const html = Object.entries(r).filter(([k,v])=>v).map(([k,v])=>`<a href="${v}" target="_blank" rel="noopener" aria-label="${k}">${ICONS[k]||''}</a>`).join('');
  $('#social').innerHTML = html;
})();

/* ================= Estado ================= */
let PRODUCTS=[], NOTAS_BY_PROD={}, PROMOS=[], PROD_BY_ID={};
let COMBOS=[], currentView='inicio';
let PREORDENES=[], CONSOLIDADOS=[];
let GIFT_STATUS=[];
let filterCat='Todos', filterGen='Todos', filterTipo='Todos', query='';
let gridDense=false, filtersOpen=false, sortMode='rel';
let CART = JSON.parse(localStorage.getItem('cart_'+CONFIG.TIENDA_NOMBRE) || '[]');
let payMethod='coordinar';
let cliente={nombre:'',tel:'',dir:''};
let cartCliMin=false;
let cartFullMode=false;
const MAYOR_MIN = Number(CONFIG.MAYOR_MIN)||0;   // 0 = no hay precio por mayor

/* --- Precio por mayor (minorista/mayorista automático por cantidad) --- */
function precioMayDe(x){ return Number(x&&x.precio_may)||0; }
function hayMayorEnCarrito(){ return MAYOR_MIN>0 && CART.some(i=>precioMayDe(i)>0); }
function unidadesCarrito(){ return CART.reduce((s,i)=>s+i.qty,0); }
function mayorActivo(){ return MAYOR_MIN>0 && unidadesCarrito()>=MAYOR_MIN; }
/* Base efectiva de un ítem según haya o no precio por mayor activo */
function baseItem(i){ const may=precioMayDe(i); return (mayorActivo()&&may>0)?may:Number(i.precio); }
/* Carrito con los precios base ya ajustados a mayorista, para el motor de promos */
/* Precio de combo aplicado a TODOS los decants del carrito (armados o sueltos). */
function cartComboUnits(){
  const cfg=CONFIG.COMBO_ARMA||{}; const precios=cfg.precios||{}; const combos=cfg.combos||{};
  const esDecant=i=> i.tipo!=='regalo' && i.tipo!=='addon' && combos[i.categoria] && !isNaN(Number(i.ml));
  const elig=CART.filter(esDecant);
  const map={}; if(!elig.length) return map;
  const rankOf=cat=>{const v=Object.values(precios[cat]||{}).map(Number).filter(x=>x>0);return v.length?Math.min(...v):0;};
  const allCats=Object.keys(precios); const sorted=[...allCats].sort((a,b)=>rankOf(a)-rankOf(b)); const idx={}; sorted.forEach((c,i)=>idx[c]=i);
  const cats=[...new Set(elig.map(i=>i.categoria))];
  const cnt={}; cats.forEach(c=>cnt[c]=elig.filter(i=>i.categoria===c).reduce((s,i)=>s+(i.qty||1),0));
  const peso=(X,C)=>Math.pow(2,(idx[X]||0)-(idx[C]||0));
  const tiersOf=cat=>{const a=(combos[cat]||[]).map(x=>Number(x.cant));return[...new Set(a)].sort((x,y)=>x-y);};
  const comboP=(cat,cant,ml)=>{const f=(combos[cat]||[]).find(x=>Number(x.cant)===cant&&String(x.ml)===String(ml));return f?Number(f.precio):null;};
  const tierByCat={};
  cats.forEach(c=>{ const tiers=tiersOf(c); if(!tiers.length){tierByCat[c]=0;return;} let eff=0; cats.forEach(x=>eff+=cnt[x]*peso(x,c)); let t=0; for(const x of tiers){if(eff>=x)t=x;} tierByCat[c]=t; });
  elig.forEach(i=>{ const t=tierByCat[i.categoria]; let unit=Number(i.precio); if(t){ const cp=comboP(i.categoria,t,i.ml); if(cp!=null) unit=Math.round(cp/t); } map[i.key]={unit, base:Number(i.precio)}; });
  return map;
}
function pricedCart(){
  const cmap=cartComboUnits();
  // Descuento por perfumes sellados (desde N, S/x por unidad; opcional que crezca)
  const sd=CONFIG.SELLADO_DESC||{};
  const esSelladoItem=i=> i.tipo!=='regalo' && i.tipo!=='addon' && String(i.ml||'').toLowerCase()==='sellado';
  const selCount = (sd.activo!==false) ? CART.filter(esSelladoItem).reduce((s,i)=>s+(i.qty||1),0) : 0;
  const desde=Number(sd.desde||2), porU=Number(sd.por_unidad!=null?sd.por_unidad:5), inc=Number(sd.incremento||0);
  const selDescU = (selCount>=desde) ? (porU + inc*(selCount-desde)) : 0;
  return CART.map(i=>{
    const base=baseItem(i); const cm=cmap[i.key];
    if(cm && cm.unit < base) return { ...i, precio:cm.unit, antes:base, tipo:'combo', _combo:true };
    if(selDescU>0 && esSelladoItem(i)){ const nu=Math.max(0, base-selDescU); if(nu<base) return { ...i, precio:nu, antes:base, tipo:'combo', _sellado:true }; }
    return { ...i, precio: base };
  });
}

/* Helpers de datos */
function presActivas(p){ return (p.presentaciones||[]).filter(x=>x&&x.activo!==false&&Number(x.precio)>0).sort((a,b)=>Number(a.precio)-Number(b.precio)); }
function imgsOf(p){ const a=Array.isArray(p.imagenes)?p.imagenes.filter(Boolean):[]; return a.length?a:(p.imagen_url?[p.imagen_url]:[]); }
function mlLabel(ml){ return String(ml).toLowerCase()==='sellado' ? 'Sellado' : ml+'ml'; }
function ofertaPct(x){ const a=Number(x.antes), pr=Number(x.precio); return (a&&pr&&a>pr)?Math.round((a-pr)/a*100):0; }
function precioEfectivo(p, x){ const r=window.PROMOS_ENGINE.precioUnit(p, x.ml, Number(x.precio), PROMOS); return r.precio; }
function _stockOrderKey(p){
  const s=stockDe(p);
  if(s==null) return 1e6;      // sin stock trackeado: como si tuviera mucho stock (va después de los numerados)
  if(s<=0) return 1e9;         // agotado / a pedido: siempre al final
  return s;                    // 1,2,3... primero
}
function _catalogDefaultSort(list){
  return [...list].sort((a,b)=>{
    const da = a.destacado?0:1, db = b.destacado?0:1;
    if(da!==db) return da-db;              // destacados siempre primero
    return _stockOrderKey(a)-_stockOrderKey(b); // luego por stock ascendente (0/agotado al final)
  });
}
function precioDesde(p){ const v=presActivas(p).map(x=>precioEfectivo(p,x)); return v.length?Math.min(...v):null; }
function precioSellado(p){
  const pres=presDeTipo(p,'Sellado').filter(x=>x&&x.activo!==false);
  if(!pres.length) return null;
  // Toma la primera presentación sellada activa (normalmente hay una sola)
  const x=pres[0];
  const actual = precioEfectivo(p,x);
  const antes = Number(x.antes||x.precio_antes||0) || null;
  return { actual, antes: (antes && antes>actual) ? antes : null };
}
function puntosCardDe(p, sello){
  if(!(CONFIG.REGALO_COMBO&&CONFIG.REGALO_COMBO.activo!==false)) return null;
  if(sello) return _selloPtsFor(p.categoria);
  const pres=presActivas(p).filter(x=>!_esSellado(x.ml));
  if(!pres.length) return null;
  const min=pres[0]; // presActivas ya viene ordenado por precio ascendente
  const pd=(CONFIG.REGALO_COMBO.puntos||{})[p.categoria]||{};
  const v=pd[String(min.ml)];
  return v!=null ? Number(v) : null;
}
function maxOfertaCard(p){
  let m=0;
  presActivas(p).forEach(x=>{
    const base=Number(x.precio), ef=precioEfectivo(p,x), antes=Number(x.antes)||base;
    const ref=Math.max(antes, base);
    if(ref>ef) m=Math.max(m, Math.round((ref-ef)/ref*100));
  });
  return m;
}
function catLabel(c){ return c==='Árabe'?'Perfume Árabe':(c||''); }
/* --- Stock --- */
function stockDe(p){ return (p.stock===null||p.stock===undefined||p.stock==='')?null:Number(p.stock); }
function agotado(p){ const s=stockDe(p); return s!=null && s<0; }
function qtyEnCarrito(pid){ return CART.filter(i=>i.id===pid).reduce((s,i)=>s+i.qty,0); }
function stockLine(p){ const s=stockDe(p); if(s==null) return '';
  const low=CONFIG.STOCK_BAJO||5;
  if(s===0) return '<span class="stk pedido">¡A pedido!</span>';
  if(s<0) return '<span class="stk out">Agotado</span>';
  if(s<=low){ const bl = s===1?'b1':(s===2?'b2':(s===3?'b3':'b4')); return `<span class="stk low ${bl}">¡Últimas ${s} unidades!</span>`; }
  return `<span class="stk ok">${s} disponibles</span>`;
}

function makeBrandQR(text, cb){
  try{
    const qr=(window.qrcode||qrcode)(0,'H'); qr.addData(text); qr.make();   // H = máxima tolerancia (permite logo al centro)
    const n=qr.getModuleCount(), margin=4, total=n+margin*2;
    const px=Math.max(8, Math.floor(640/total)); const dim=px*total;
    const cv=document.createElement('canvas'); cv.width=dim; cv.height=dim;
    const ctx=cv.getContext('2d');
    ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,dim,dim);
    ctx.fillStyle='#111111';
    for(let r=0;r<n;r++) for(let c=0;c<n;c++) if(qr.isDark(r,c)) ctx.fillRect((c+margin)*px,(r+margin)*px,px,px);
    // Badge central con la marca
    const nombre=(CONFIG.TIENDA_NOMBRE||'').trim();
    const ciudad=(CONFIG.CIUDAD||'').trim();
    const words=nombre.split(/\s+/).filter(Boolean);
    const big=(words[0]||'DDS');
    const small=(words.slice(1).join(' ')+(ciudad?(' '+ciudad):'')).trim().toUpperCase();
    const bw=Math.round(dim*0.28), bx=Math.round((dim-bw)/2);
    // fondo blanco redondeado + borde dorado
    ctx.fillStyle='#ffffff'; _rr(ctx,bx,bx,bw,bw,Math.round(bw*0.2)); ctx.fill();
    ctx.lineWidth=Math.max(3,Math.round(dim*0.010)); ctx.strokeStyle='#c69a3e'; _rr(ctx,bx,bx,bw,bw,Math.round(bw*0.2)); ctx.stroke();
    // texto
    ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillStyle='#111111';
    const cx=dim/2, cy=dim/2;
    ctx.font=`700 ${Math.round(bw*0.30)}px Georgia, 'Cormorant Garamond', serif`;
    ctx.fillText(big, cx, cy - (small?bw*0.10:0));
    if(small){
      ctx.fillStyle='#c69a3e';
      let fs=Math.round(bw*0.13);
      ctx.font=`700 ${fs}px Arial, sans-serif`;
      while(fs>7 && ctx.measureText(small).width > bw*0.82){ fs--; ctx.font=`700 ${fs}px Arial, sans-serif`; }
      ctx.fillText(small, cx, cy + bw*0.20);
    }
    cb(cv.toDataURL('image/png'));
  }catch(e){ console.warn('QR error',e); cb(''); }
}

/* ================= ARMA TU COMBO ================= */
let armarCat=null, armarMl=null, armarSel=[];
function armarCfg(){ return CONFIG.COMBO_ARMA||{}; }
function armarPrecios(){ return armarCfg().precios||{}; }
function armarCats(){ return Object.keys(armarPrecios()); }
function armarSizesDe(cat){ return Object.keys(armarPrecios()[cat]||{}); }         // ['3','5','10',...]
function armarPrecioDe(cat,ml){ const p=(armarPrecios()[cat]||{})[ml]; return p==null?null:Number(p); }
function armarDesdeDe(cat){ const v=Object.values(armarPrecios()[cat]||{}).map(Number); return v.length?Math.min(...v):null; }

function armarCalc(){
  const cfg=armarCfg();
  const precios=cfg.precios||{};
  const combos=cfg.combos||{};
  const items=armarSel;
  const n=items.length;
  // Precio base = precio registrado del producto; si no, la tabla base
  const base=(it)=>{ const v=Number(it.precio); if(v>0) return v; const p=(precios[it.categoria]||{})[String(it.ml)]; return p!=null?Number(p):0; };
  // Rango global por precio mínimo (0 = más barata)
  const rankOf=(cat)=>{ const vals=Object.values(precios[cat]||{}).map(Number).filter(x=>x>0); return vals.length?Math.min(...vals):0; };
  const allCats=Object.keys(precios);
  const sortedAll=[...allCats].sort((a,b)=>rankOf(a)-rankOf(b));
  const idx={}; sortedAll.forEach((c,i)=>idx[c]=i);       // 0=árabe,1=diseñador,2=nicho
  const cats=[...new Set(items.map(i=>i.categoria))];
  const cnt={}; cats.forEach(c=>cnt[c]=items.filter(i=>i.categoria===c).length);
  // Conversión: peso de un decant X hacia el tramo de C = 2^(nivel(X)-nivel(C))
  //  (más caro suma más: dis→árabe=2, nicho→árabe=4, nicho→dis=2; más barato suma menos: árabe→dis=0.5, árabe→nicho=0.25)
  const peso=(X,C)=> Math.pow(2, (idx[X]||0)-(idx[C]||0));
  const tiersOf=(cat)=>{ const a=(combos[cat]||[]).map(x=>Number(x.cant)); return [...new Set(a)].sort((x,y)=>x-y); };
  const comboP=(cat,cant,ml)=>{ const f=(combos[cat]||[]).find(x=>Number(x.cant)===cant && String(x.ml)===String(ml)); return f?Number(f.precio):null; };

  // Tramo (cantidad de combo) por categoría según el conteo convertido
  const tierByCat={};
  cats.forEach(c=>{
    const tiers=tiersOf(c); if(!tiers.length){ tierByCat[c]=0; return; }
    let eff=0; cats.forEach(x=>eff+=cnt[x]*peso(x,c));
    let t=0; for(const x of tiers){ if(eff>=x) t=x; }
    tierByCat[c]=t;   // 0 = sin combo (precio base)
  });

  let subtotal=0, total=0; const detalle=[];
  items.forEach(it=>{
    const b=base(it); subtotal+=b;
    const t=tierByCat[it.categoria];
    let pu=b;
    if(t){ const cp=comboP(it.categoria,t,it.ml); if(cp!=null) pu=cp/t; }
    total+=pu;
    detalle.push({ ...it, base:b, final:Math.round(pu) });
  });
  subtotal=Math.round(subtotal);
  total=Math.round(total);
  const desc=Math.max(0, subtotal-total);
  return { subtotal, desc, total, n, pct: subtotal>0?Math.round(desc/subtotal*100):0, tierByCat, detalle };
}

function renderArmar(){
  const cont=$('#armarView'); if(!cont) return;
  const cfg=armarCfg();
  const cats=armarCats();
  if(!armarCat && cats.length===1) armarCat=cats[0];
  const sizes = armarCat?armarSizesDe(armarCat):[];
  if(armarMl && !sizes.includes(armarMl)) armarMl=null;
  const C=armarCalc();

  // Pasos
  const stepOn=(s)=> s==='cat' ? true : s==='ml' ? !!armarCat : (!!armarCat && !!armarMl);
  const steps=`<div class="armar-steps">
    <span class="armar-step ${stepOn('cat')?'on':''}"><b>1</b>Categoría</span><span class="sep"></span>
    <span class="armar-step ${stepOn('ml')?'on':''}"><b>2</b>Tamaño</span><span class="sep"></span>
    <span class="armar-step ${stepOn('per')?'on':''}"><b>3</b>Perfumes</span>
  </div>`;

  // Categorías
  const catsHtml=`<div class="armar-lbl">Categoría</div><div class="armar-cats">${cats.map(c=>{
    const desde=armarDesdeDe(c);
    return `<button class="armar-opt ${armarCat===c?'on':''}" data-cat="${esc(c)}"><div class="t">${c==='Árabe'?'ÁRABES':esc(String(c).toUpperCase())}</div><div class="s">${desde!=null?'Desde '+fmt(desde):''}</div></button>`;
  }).join('')}</div>`;

  // Tamaños (si hay categoría)
  let sizesHtml='';
  if(armarCat){
    const _rc=(CONFIG.REGALO_COMBO&&CONFIG.REGALO_COMBO.activo!==false)?CONFIG.REGALO_COMBO:null;
    sizesHtml=`<div class="armar-lbl">Tamaño</div><div class="armar-sizes">${sizes.map(ml=>{
      const pr=armarPrecioDe(armarCat,ml);
      const pts=_rc?((_rc.puntos&&_rc.puntos[armarCat]||{})[String(ml)]):null;
      return `<button class="armar-opt ${armarMl===ml?'on':''}" data-ml="${esc(ml)}"><div class="t">${esc(ml)}ML</div><div class="s">Individual ${fmt(pr)}</div>${pts?`<div class="armar-pts">🎁 +${pts} pts</div>`:''}</button>`;
    }).join('')}</div>`;
  }

  // Contador + hint
  const minD=(cfg.pct_tramos&&cfg.pct_tramos.length)?Math.min(...cfg.pct_tramos.map(d=>Number(d.n))):2;
  const hint = C.n===0 ? `Selecciona mínimo ${minD} para el descuento`
    : (C.pct>0?`¡Combo activo! Sigue agregando para más descuento`:(C.n<minD?`Agrega ${minD-C.n} más para el descuento`:'¡Combo activo!'));
  const countHtml=`<div class="armar-count"><b>${C.n}</b><span>${esc(hint)}</span></div>`;

  // Grilla de perfumes (si hay categoría y tamaño)
  let gridHtml='';
  if(armarCat && armarMl){
    const list=(PRODUCTS||[]).filter(p=>p.visible!==false && (p.categoria===armarCat) && presActivas(p).some(x=>String(x.ml)===String(armarMl) && !_esSellado(x.ml)));
    if(!list.length) gridHtml=`<div class="armar-hint">Aún no hay perfumes en ${esc(armarCat)}. Cárgalos en el panel.</div>`;
    else gridHtml=`<div class="armar-grid">${list.map(p=>{
      const key=p.id+'__'+armarMl; const on=armarSel.some(x=>x.key===key);
      const img=imgsOf(p)[0];
      const imgHtml=img?`<img src="${esc(img)}" loading="lazy">`:`<span class="ph">${esc((p.nombre||'?')[0])}</span>`;
      return `<button class="armar-pcard ${on?'on':''}" data-add="${p.id}"><span class="armar-pcheck">✓</span><div class="armar-pimg">${imgHtml}</div><div class="armar-pname">${esc(p.nombre)}</div></button>`;
    }).join('')}</div>`;
  } else if(armarCat && !armarMl){
    gridHtml=`<div class="armar-hint">Elige un tamaño para ver los perfumes disponibles.</div>`;
  } else {
    gridHtml=`<div class="armar-hint">Elige una categoría para empezar.</div>`;
  }

  // Sidebar
  const umbral=Number(cfg.envio_gratis_desde)||0;
  let envioHtml='';
  if(umbral>0){
    if(C.total>=umbral) envioHtml=`<div class="armar-envio ok">🚚 ¡Tienes envío gratis!</div>`;
    else envioHtml=`<div class="armar-envio">🚚 Te faltan ${fmt(umbral-C.total)} para envío gratis</div>`;
  }
  const _detByKey={}; (C.detalle||[]).forEach(d=>{ _detByKey[d.key]=d; });
  const itemsHtml = armarSel.length ? armarSel.map(i=>{
    const d=_detByKey[i.key]||{}; const base=Number(d.base!=null?d.base:i.precio)||0; const fin=Number(d.final!=null?d.final:base)||0;
    const off = base>0 ? Math.round((1-fin/base)*100) : 0;
    const priceHtml = (fin<base && off>0)
      ? `<div class="ai-price"><span class="ai-tach">${fmt(base)}</span><span class="ai-now">${fmt(fin)}</span><span class="ai-off">-${off}%</span></div>`
      : `<div class="ai-price">${fmt(base)}</div>`;
    return `<div class="armar-item">
      <div class="ai-body"><div class="ai-name">${esc(i.nombre)}</div><div class="ai-tag">${esc(i.categoria)} · ${esc(i.ml)}ml</div></div>
      ${priceHtml}
      <div class="ai-del" data-del="${esc(i.key)}">✕</div>
    </div>`; }).join('') : `<div class="armar-empty">Ningún perfume seleccionado aún</div>`;
  // Progreso de puntos de regalo en el combo
  let puntosHtml='';
  const _rc=(CONFIG.REGALO_COMBO&&CONFIG.REGALO_COMBO.activo!==false)?CONFIG.REGALO_COMBO:null;
  if(_rc){
    const pdef=_rc.puntos||{}; const _tiers=regaloTiers();
    let pts=0; armarSel.forEach(i=>{ const v=(pdef[i.categoria]||{})[String(i.ml)]; if(v!=null) pts+=Number(v); });
    const desbloq=_tiers.filter(t=>pts>=Number(t.meta));
    const siguiente=_tiers.find(t=>pts<Number(t.meta));
    if(desbloq.length){
      const top=desbloq[desbloq.length-1];
      puntosHtml=`<div class="armar-pts-box on">🎁 ¡Ya puedes elegir ${esc((top.label||'tu premio').toLowerCase())}! ${siguiente?`(+${Number(siguiente.meta)-pts} pts para ${esc(siguiente.label||'otro premio')})`:''}</div>`;
    } else if(pts>0 && siguiente){
      puntosHtml=`<div class="armar-pts-box">🎁 Llevas <b>${pts} pts</b> · Te faltan <b>${Number(siguiente.meta)-pts}</b> para ${esc(siguiente.label||'un premio gratis')}</div>`;
    } else if(_tiers[0]){
      puntosHtml=`<div class="armar-pts-box">🎁 Suma <b>${_tiers[0].meta} pts</b> y llévate ${esc((_tiers[0].label||'un decant').toLowerCase())} gratis</div>`;

  const sideHtml=`<div class="armar-scrim" id="armarScrim"></div><div class="armar-side" id="armarSide">

    ${envioHtml}

    ${C.n?`<div class="armar-seguir" id="armarSeguir">👉 Toca aquí o fuera del panel para seguir agregando perfumes</div>`:''}
    <div class="armar-items">${itemsHtml}</div>
    <div class="armar-side-bot">
      <div class="armar-row"><span>Precio sin descuento</span><span>${fmt(C.subtotal)}</span></div>
      ${C.desc>0?`<div class="armar-row desc"><span>Descuento (${C.pct}%)</span><span>- ${fmt(C.desc)}</span></div>`:''}
      <div class="armar-total"><span>TOTAL A PAGAR</span><b>${fmt(C.total)}</b></div>

    </div>
  </div>

  cont.innerHTML=`<div class="armar-head"><h2>${esc(cfg.titulo||'Arma tu combo')}</h2><p>${esc(cfg.subtitulo||'')}</p></div>
    ${steps}
    <div class="armar-body">
      <div class="armar-main">${catsHtml}${sizesHtml}${countHtml}${gridHtml}</div>
      ${sideHtml}
    </div>`;

  cont.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{ armarCat=b.dataset.cat; renderArmar(); });
  cont.querySelectorAll('[data-ml]').forEach(b=>b.onclick=()=>{ armarMl=b.dataset.ml; renderArmar(); });
  cont.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>armarToggle(b.dataset.add));
  cont.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{ armarSel=armarSel.filter(x=>x.key!==b.dataset.del); renderArmar(); });
  const pay=$('#armarPay'); if(pay) pay.onclick=armarCheckout;
  // Drawer móvil del combo
  const closeSide=()=>{ window._armarCloseTs=Date.now(); const s=$('#armarSide'); const sc=$('#armarScrim'); if(s)s.classList.remove('open'); if(sc)sc.classList.remove('open'); document.removeEventListener('click', _armarSwallow, true); document.removeEventListener('pointerdown', _armarSwallow, true); };
  function _armarSwallow(e){
    const panel=$('#armarSide');
    if(panel && panel.contains(e.target)) return; // toques dentro del panel funcionan normal
    e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation();
    window._armarCloseTs=Date.now();
    closeSide();
  }
  window._armarSwallowOff=()=>{ document.removeEventListener('click', _armarSwallow, true); document.removeEventListener('pointerdown', _armarSwallow, true); };
  const openSide=()=>{ const s=$('#armarSide'); const sc=$('#armarScrim'); if(s)s.classList.add('open'); if(sc)sc.classList.add('open'); if(window._navReady&&window.innerWidth<=900)_navPush('combopanel');
    document.addEventListener('click', _armarSwallow, true); document.addEventListener('pointerdown', _armarSwallow, true);
  };
  { const x=$('#armarSideX'); if(x) x.onclick=(e)=>{ e.stopPropagation(); closeSide(); }; }
  { const sc=$('#armarScrim'); if(sc) sc.onclick=closeSide; }
  { const sg=$('#armarSeguir'); if(sg) sg.onclick=(e)=>{ e.stopPropagation(); closeSide(); }; }
  { const vf=$('#armarVerFab'); if(vf){ vf.style.display = (window.innerWidth<=900 && C.n>0)?'block':'none'; vf.onclick=openSide; } }
  if(window._armarJustAdded && window.innerWidth<=900){ window._armarJustAdded=false; openSide(); }
}

function armarToggle(id){
  if(!armarMl){ toast('Elige primero el tamaño'); return; }
  const p=(PRODUCTS||[]).find(x=>x.id===id); if(!p) return;
  const key=id+'__'+armarMl;
  const idx=armarSel.findIndex(x=>x.key===key);
  if(idx>=0){ armarSel.splice(idx,1); }
  else{
    // Precio = precio propio del producto para esa talla de decant (nunca el genérico de categoría)
    let precio=null;
    const pres=(presActivas(p)||[]).find(x=>String(x.ml)===String(armarMl) && !_esSellado(x.ml));
    if(pres) precio=Number(pres.precio);
    if(precio==null){ toast('Ese perfume no tiene decants a la venta',true); return; }

const COMP_BUCKET = CONFIG.BUCKET_COMPROBANTES || 'comprobantes';
function cupoRestante(p){ if(p.cupo==null||p.cupo==='') return null; return Math.max(0, Number(p.cupo)-Number(p.reservado||0)); }

function renderPre(){

function openPre(id){
  const p = PREORDENES.find(x=>x.id===id); if(!p) return;
  const imgs=imgsOf(p); const mainImg=imgs[0];
  const rest=cupoRestante(p); const max = rest!=null?rest : 99;

  function draw(){
    $('#sheet').innerHTML = `
      <div class="hd">
        <button class="close" id="closeSheet" aria-label="Cerrar"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M6 6l12 12M18 6L6 18" stroke-linecap="round"/></svg></button>

        ${rest!=null?`<div><span class="stock-modal ${rest<=0?'out':'low'}">${rest<=0?'Cupo lleno':('Quedan '+rest+' cupos de '+p.cupo)}</span></div>`:''}

        <div class="section-t">¿Cómo funciona?</div>
        <div class="genero" style="line-height:1.6">Reservas tu perfume, adjuntas tu comprobante de pago y nosotros confirmamos tu preorden. Podrás consultar el estado con tu código.</div>

        ${max>0?`
        <div class="section-t">Cantidad</div>
        <div class="qty-pick"><div class="stepper"><button id="qMinus">−</button><input class="qv" id="qVal" type="number" min="1" max="${max}" inputmode="numeric" value="${qty}"><button id="qPlus">+</button></div><span style="color:var(--muted);font-size:.85rem" id="qTot">${fmt(precio*qty)}</span></div>

        <div class="section-t">Tu comprobante de pago</div>
        <div class="pay-up">
          <label>Sube la foto de tu pago / depósito (obligatorio)</label>
          <input id="preFiles" type="file" accept="image/*" multiple>
          <div class="pay-thumbs" id="preThumbs"></div>
        </div>

        <div class="section-t">Tus datos</div>
        <div class="miniform">
          <input id="preNombre" placeholder="Nombre completo *" value="${esc(cliente.nombre||'')}">
          <input id="preTel" placeholder="Teléfono / WhatsApp *" inputmode="tel" value="${esc(cliente.tel||'')}">
          <input id="preDir" placeholder="Dirección o referencia (opcional)" value="${esc(cliente.dir||'')}">

        <button class="add-cta" id="preSend">Reservar mi preorden · ${fmt(precio*qty)}</button>
        `:`<div class="section-t">Preventa cerrada</div><div class="genero">Se agotaron los cupos de este perfume.</div>`}
      </div>`;

    $('#closeSheet').onclick = closeProduct;
    if(max>0){
      const qEl=$('#qVal');
      const refresh=()=>{ if(qEl) qEl.value=qty; $('#qTot').textContent=fmt(precio*qty); $('#preSend').textContent=`Reservar mi preorden · ${fmt(precio*qty)}`; };
      $('#qMinus').onclick=()=>{ qty=Math.max(1,qty-1); refresh(); };
      $('#qPlus').onclick =()=>{ qty=Math.min(max,qty+1); if(qty===max) toast('Es el máximo de cupos disponibles'); refresh(); };
      if(qEl){ qEl.oninput=()=>{ let v=parseInt((qEl.value||'').replace(/[^\d]/g,''),10); if(isNaN(v))v=0; if(v>max){ v=max; qEl.value=max; toast('Es el máximo de cupos disponibles'); } qty=Math.max(1,v||1); $('#qTot').textContent=fmt(precio*qty); $('#preSend').textContent=`Reservar mi preorden · ${fmt(precio*qty)}`; };
        qEl.onblur=()=>{ qEl.value=qty; }; }
      function drawThumbs(){ $('#preThumbs').innerHTML=files.map((u,i)=>`<div class="pt"><img src="${esc(u.url)}"><button data-rm="${i}">×</button></div>`).join('');
        $('#preThumbs').querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{ files.splice(+b.dataset.rm,1); drawThumbs(); }); }
      $('#preFiles').onchange = async e => { const fs=[...e.target.files]; if(!fs.length)return; toast('Subiendo comprobante...');

    setTimeout(()=>{ if(confirm('¿Enviar también tu preorden por WhatsApp para confirmar más rápido?')) window.open(`https://wa.me/${CONFIG.WHATSAPP}?text=${msg}`,'_blank'); }, 300);

  draw();
  $('#overlay').classList.add('open'); document.body.style.overflow='hidden';

/* ============================================================
   NUEVO — CONSOLIDADO por INVERSIÓN (individual + grupo con aprobación)
   La campaña tiene "brackets" de inversión; el precio de cada perfume
   depende de cuánto invierte el cliente (o el grupo).
   ============================================================ */
function bracketsOrden(c){ return (Array.isArray(c.brackets)?c.brackets:[]).map(b=>({umbral:Number(b.umbral)||0, etiqueta:b.etiqueta||''})).sort((a,b)=>a.umbral-b.umbral); }
function bracketIdxDe(c, monto){ const bs=bracketsOrden(c); if(!bs.length) return -1; let idx=0; bs.forEach((b,i)=>{ if((Number(monto)||0)>=b.umbral) idx=i; }); return idx; }
function itemsDe(c){ return Array.isArray(c.items)?c.items:[]; }
function itemAgotado(it){ return !!(it && (it.agotado || (it.stock!=null && Number(it.stock)<=0))); }
function precioItem(c, itemIdx, bIdx){ const it=itemsDe(c)[itemIdx]; if(!it) return 0; const p=(it.precios||[])[bIdx]; return Number(p)||0; }

function renderCon(){
  const list = CONSOLIDADOS.filter(c => !query || ((c.nombre||'')+' '+(c.marca||'')).toLowerCase().includes(query));
  if(!list.length){ $('#conGrid').innerHTML = `<div class="state">No hay consolidados abiertos por ahora.</div>`; return; }
  $('#conGrid').innerHTML = list.map(c => {
    const main=imgsOf(c)[0]; const bs=bracketsOrden(c); const its=itemsDe(c);
    let best=null;
    if(bs.length && its.length){ const bi=bs.length-1; its.forEach((it,i)=>{ if(itemAgotado(it))return; const p=precioItem(c,i,bi); if(p>0) best=(best==null?p:Math.min(best,p)); }); }
    return `<button class="card" data-con="${c.id}">
      <span class="badge-con">Consolidado 🤝</span>
      <div class="imgwrap">${main ? `<img src="${esc(main)}" alt="${esc(c.nombre)}" loading="lazy">` : `<span class="ph">${esc((c.nombre||'?')[0])}</span>`}</div>
      <div class="body">
        <span class="marca">${esc(c.marca||'Campaña')}</span>
        <span class="nombre">${esc(c.nombre)}</span>
        <span class="stk ok">${its.length} perfumes · mín. ${c.min_modelos||1} modelos</span>
        ${c.fecha_llegada?`<span class="escala-mini">Llegada: ${esc(c.fecha_llegada)}</span>`:''}
        <div class="foot">
          <span class="precio">${best!=null?`<small>Desde</small><b>${fmt(best)}</b>`:'<small>Precio</small><b>Según inversión</b>'}</span>
          <span class="ver">→</span>
        </div>
      </div>
    </button>`;
  }).join('');
  document.querySelectorAll('#conGrid .card').forEach(c=>c.onclick=()=>openCon(c.dataset.con));
}

function openCon(id){
  const c = CONSOLIDADOS.find(x=>x.id===id); if(!c) return;
  const imgs=imgsOf(c); const mainImg=imgs[0];
  const bs=bracketsOrden(c); const its=itemsDe(c);
  const minMod=Number(c.min_modelos)||0;
  const st={ pantalla:'inicio', modo:null, grupoSel:null, inversion:'', cart:{}, files:[], grupos:[], nuevo:{nombre:'',meta:Number(c.meta_grupo)||0,lnombre:'',ltel:''} };

  function montoBaseGrupo(){ return (st.modo==='grupo' && st.grupoSel && st.grupoSel!=='nuevo') ? (Number(st.grupoSel.total)||0) : 0; }
  function bIdxActual(){
    let monto;
    if(st.modo==='grupo'){
      const base = montoBaseGrupo()+(Number(st.inversion)||0);
      const meta = Number(st.grupoSel && st.grupoSel.meta)||0;
      monto = Math.max(meta, base);
    } else { monto = Number(st.inversion)||0; }
    return bracketIdxDe(c, monto);
  }
  function resumen(){ let t=0, mods=0, unid=0; const bi=bIdxActual(); Object.keys(st.cart).forEach(k=>{ const q=st.cart[k]||0; if(q>0){ t+=precioItem(c,+k,bi)*q; mods++; unid+=q; } }); return {t,mods,unid}; }
  function etiquetaActual(){ const bi=bIdxActual(); return bi>=0 && bs[bi] ? bs[bi].etiqueta : ''; }

  const hd = () => `<div class="hd">
      <button class="close" id="closeSheet" aria-label="Cerrar"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M6 6l12 12M18 6L6 18" stroke-linecap="round"/></svg></button>
      ${mainImg ? `<img src="${esc(mainImg)}" alt="${esc(c.nombre)}">` : `<div class="ph" style="font-size:4rem">${esc((c.nombre||'?')[0])}</div>`}
    </div>`;

  function tablaPrecios(){
    if(!bs.length || !its.length) return '';
    return `<div class="con-table"><table><thead><tr><th>Perfume</th><th>Stock</th>${bs.map(b=>`<th>${esc(b.etiqueta||fmt(b.umbral))}</th>`).join('')}</tr></thead>
      <tbody>${its.map(it=>{ const ag=itemAgotado(it);
        return `<tr><td>${esc(it.nombre||'')}<br><small style="color:var(--muted)">${esc(it.marca||'')}</small></td>
          <td class="${ag?'agot':''}">${ag?'AGOTADO':(it.stock!=null?it.stock:'—')}</td>
          ${bs.map((b,bi)=>`<td>${ag?'—':fmt(Number((it.precios||[])[bi])||0)}</td>`).join('')}</tr>`;
      }).join('')}</tbody></table></div>`;
  }

  function filaPerfume(i){
    const it=its[i]; const bi=bIdxActual(); const q=st.cart[i]||0; const precio=precioItem(c,i,bi); const ag=itemAgotado(it);
    return `<div class="con-row ${ag?'agot':''}">
      <div class="cr-info"><b>${esc(it.nombre||'')}</b><span>${esc(it.marca||'')}${(it.stock!=null&&!ag)?` · stock ${it.stock}`:''}</span></div>
      <div class="cr-precio" data-price="${i}">${ag?'<span class="agot-tag">AGOTADO</span>':fmt(precio)}</div>
      ${ag?'<div></div>':`<div class="stepper sm"><button data-cm="${i}">−</button><input class="qv" type="number" min="0" inputmode="numeric" data-cq="${i}" value="${q}"><button data-cp="${i}">+</button></div>`}
      <div class="cr-sub" data-sub="${i}">${(q>0&&!ag)?fmt(precio*q):''}</div>
    </div>`;
  }

  /* -------- Pantalla INICIO (elegir modo) -------- */
  function screenInicio(){
    $('#sheet').innerHTML = hd() + `<div class="bd">
      <div class="marca">Consolidado 🤝</div>
      <h2>${esc(c.nombre)}</h2>
      <div class="genero">${esc(c.marca||'')}${c.descripcion?' · '+esc(c.descripcion):''}</div>
      ${c.fecha_llegada?`<div><span class="stock-modal low">Llegada del contenedor: ${esc(c.fecha_llegada)}</span></div>`:''}
      <div class="section-t">¿Cómo funciona?</div>
      <div class="genero" style="line-height:1.6">Dices cuánto quieres <b>invertir</b> y armas tu pedido con los perfumes de la campaña (mínimo <b>${minMod}</b> modelos distintos). Mientras más inviertes —tú solo o junto a un <b>grupo</b>— más barato es cada perfume.</div>
      <div class="section-t">Precios según inversión</div>
      ${tablaPrecios()}
      <div class="section-t">Elige cómo pedir</div>
      <button class="add-cta" id="goInd">🙋 Pedir yo solo (individual)</button>
      <button class="add-cta ghost" id="goGrp" style="margin-top:8px">👥 Unirme o crear un grupo</button>
      <button class="add-cta ghost" id="goEdit" style="margin-top:8px">✏️ Ya tengo un pedido aquí (editarlo)</button>
    </div>`;
    $('#closeSheet').onclick=closeProduct;
    $('#goInd').onclick=()=>{ st.modo='individual'; st.grupoSel=null; st.pantalla='pedido'; render(); };
    $('#goGrp').onclick=()=>{ st.modo='grupo'; st.pantalla='grupos'; cargarGrupos(); };
    $('#goEdit').onclick=()=>{ st.pantalla='editlogin'; render(); };
  }

  /* -------- Pantalla EDITAR: login del cliente -------- */
  function screenEditLogin(){
    $('#sheet').innerHTML = hd() + `<div class="bd">
      <button class="con-back" id="back">← Volver</button>
      <div class="marca">Editar mi pedido</div>
      <h2>${esc(c.nombre)}</h2>
      <div class="genero">Si ya hiciste un pedido en esta campaña, ingresa con tu nombre y la contraseña que te dimos para editarlo. Los cambios quedan pendientes hasta que los aprobemos.</div>
      <div class="miniform" style="margin-top:12px"><input id="edcUser" placeholder="Tu nombre *" autocomplete="name"></div>
      <div class="miniform" style="margin-top:10px"><input id="edcPass" type="password" placeholder="Contraseña *" autocomplete="current-password"></div>
      <button class="add-cta" id="edcBtn" style="margin-top:14px">Buscar mi pedido</button>
      <div id="edcResult" style="margin-top:12px"></div>
    </div>`;
    $('#closeSheet').onclick=closeProduct;
    $('#back').onclick=()=>{ st.pantalla='inicio'; render(); };
    $('#edcBtn').onclick=buscarMiPedidoCon;
    $('#edcPass').addEventListener('keydown',e=>{ if(e.key==='Enter') buscarMiPedidoCon(); });
  }
  async function buscarMiPedidoCon(){
    const uu=($('#edcUser').value||'').trim(), pp=($('#edcPass').value||'');
    if(!uu||!pp){ toast('Escribe tu nombre y contraseña'); return; }
    $('#edcResult').innerHTML='<div class="state" style="padding:14px"><div class="spinner"></div></div>';
    const { data, error } = await sb.rpc('cliente_login', { p_usuario:uu, p_pass:pp });
    if(error){ $('#edcResult').innerHTML='<div class="genero">Ocurrió un error. Intenta de nuevo.</div>'; return; }
    const mis=(data||[]).filter(o=>o.tipo==='consolidado' && o.consolidado_id===c.id);
    if(!mis.length){ $('#edcResult').innerHTML='<div class="genero">No encontramos un pedido tuyo en esta campaña, o tu acceso aún no está activo.</div>'; return; }

/* ---- Comprobantes, código y pantalla de éxito ---- */
const enc = s => encodeURIComponent(s);
async function subirComprobante(file){
  try{
    const ext=(file.name.split('.').pop()||'jpg').toLowerCase();
    const path=`pagos/${Date.now()}_${Math.random().toString(36).slice(2,7)}.${ext}`;
    const { error } = await sb.storage.from(COMP_BUCKET).upload(path, file, {upsert:true});
    if(error){ toast('No se pudo subir la imagen'); return null; }
    return sb.storage.from(COMP_BUCKET).getPublicUrl(path).data.publicUrl;
  }catch(e){ toast('No se pudo subir la imagen'); return null; }
}
function guardarCodigo(cod){ try{ const k='mispedidos_'+CONFIG.TIENDA_NOMBRE; const arr=JSON.parse(localStorage.getItem(k)||'[]'); arr.unshift(cod); localStorage.setItem(k, JSON.stringify([...new Set(arr)].slice(0,20))); }catch(e){} }
function okScreen(titulo, codigo, texto){
  $('#sheet').innerHTML = `<div class="hd" style="padding:22px 24px"><button class="close" id="closeSheet"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M6 6l12 12M18 6L6 18" stroke-linecap="round"/></svg></button></div>

      <p>${esc(texto)}</p>
      <button class="add-cta" id="okClose" style="margin-top:18px">Entendido</button>
    </div></div>`;
  $('#closeSheet').onclick=closeProduct; $('#okClose').onclick=closeProduct;
  $('#overlay').classList.add('open'); document.body.style.overflow='hidden';
}

/* Resumen de pagos de un pedido */
function resumenPagos(o){
  let pagado=0, porConfirmar=0;
  (o.abonos||[]).forEach(a=>{ const m=Number(a.monto)||0; if(a.confirmado) pagado+=m; else porConfirmar+=m; });
  const saldo=(Number(o.total)||0)-pagado;
  return { pagado, porConfirmar, saldo };
}

/* Cargar SheetJS solo cuando se exporta */
async function cargarXLSX(){
  if(window.XLSX) return window.XLSX;
  await new Promise((res,rej)=>{ const s=document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload=res; s.onerror=()=>rej(new Error('cdn')); document.head.appendChild(s); });
  return window.XLSX;
}
async function exportarPedidoExcel(o){
  let XLSX; try{ XLSX=await cargarXLSX(); }catch(e){ toast('No se pudo cargar el exportador'); return; }
  const M=CONFIG.MONEDA||'S/';
  const filas=[];
  filas.push([(o.tipo==='preorden'?'PREORDEN':'CONSOLIDADO')+(o.consolidado_nombre?' · '+o.consolidado_nombre:'')]);
  filas.push(['Código', o.codigo||'']);
  filas.push(['Cliente', o.cliente_nombre||'']);
  if(o.tipo==='consolidado' && o.bracket_etiqueta) filas.push(['Escala de precio', o.bracket_etiqueta]);
  filas.push(['Estado', estadoTextoCliente(o.estado)]);
  filas.push([]);
  filas.push(['Perfume','Marca','Cantidad','Precio unit. ('+M+')','Subtotal ('+M+')']);
  (o.items||[]).forEach(it=>{ const q=it.qty||1, pu=(it.precio_unit!=null?it.precio_unit:it.precio), sub=(it.subtotal!=null?it.subtotal:(pu!=null?pu*q:'')); filas.push([it.nombre||'',it.marca||'',q,pu!=null?pu:'',sub]); });
  filas.push([]);
  filas.push(['','','','TOTAL DEL PEDIDO', Number(o.total)||0]);
  if(o.tipo==='consolidado' && o.inversion_declarada!=null){
    filas.push(['','','','Inversión declarada', Number(o.inversion_declarada)||0]);
    filas.push(['','','','Diferencia', (Number(o.inversion_declarada)||0)-(Number(o.total)||0)]);
  }
  // Pagos
  const pg=resumenPagos(o);
  filas.push([]);
  filas.push(['PAGOS / ABONOS']);
  filas.push(['Fecha','Nota','Registrado por','Estado','Monto ('+M+')']);
  (o.abonos||[]).forEach(a=>{ filas.push([ a.fecha?new Date(a.fecha).toLocaleString():'', a.nota||'', a.por||'', a.confirmado?'Confirmado':'Por confirmar', Number(a.monto)||0 ]); });
  filas.push([]);
  filas.push(['','','','Pagado (confirmado)', pg.pagado]);
  if(pg.porConfirmar>0) filas.push(['','','','Reportado sin confirmar', pg.porConfirmar]);
  filas.push(['','','','Saldo por pagar', Math.max(0,pg.saldo)]);
  const ws=XLSX.utils.aoa_to_sheet(filas);
  ws['!cols']=[{wch:26},{wch:16},{wch:12},{wch:16},{wch:16}];
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Pedido');
  XLSX.writeFile(wb, 'pedido-'+(o.codigo||'export')+'.xlsx');
}

/* ================= Grid ================= */
function _esSellado(ml){ return String(ml).toLowerCase()==='sellado'; }
function presDeTipo(p, tipo){ return presActivas(p).filter(x=> tipo==='Sellado' ? _esSellado(x.ml) : !_esSellado(x.ml)); }
function tieneTipo(p, tipo){ return presDeTipo(p,tipo).length>0; }
function render(){
  let list = PRODUCTS.filter(p =>
    (filterCat==='Todos' || p.categoria===filterCat) &&
    (filterGen==='Todos' || p.genero===filterGen) &&
    (filterTipo==='Todos' || tieneTipo(p, filterTipo)) &&
    (!query || ((p.nombre||'')+' '+(p.marca||'')).toLowerCase().includes(query))
  );
  const fc=$('#fcount'); if(fc) fc.textContent = `${list.length} artículo${list.length!==1?'s':''}`;
  if(!list.length){ $('#grid').innerHTML = `<div class="state">No encontramos fragancias con ese filtro.</div>`; return; }
  // Orden
  if(sortMode==='pasc') list=[...list].sort((a,b)=>(precioDesde(a)??1e9)-(precioDesde(b)??1e9));
  else if(sortMode==='pdesc') list=[...list].sort((a,b)=>(precioDesde(b)??-1)-(precioDesde(a)??-1));
  else if(sortMode==='az') list=[...list].sort((a,b)=>String(a.nombre||'').localeCompare(String(b.nombre||'')));
  else list=_catalogDefaultSort(list); // por defecto: destacados primero, luego menos stock primero (agotados al final)
  const gridEl=$('#grid'); if(gridEl) gridEl.classList.toggle('dense', gridDense);

  $('#grid').innerHTML = list.map(p => {
    const desde = precioDesde(p);
    const sello = precioSellado(p);
    const main = imgsOf(p)[0];
    const off = maxOfertaCard(p);
    const pts = puntosCardDe(p, !!sello);
    const precioHtml = sello
      ? `<span class="precio precio-sello"><small>Perfume completo</small><b>${sello.antes?`<span class="antes">${fmt(sello.antes)}</span>`:''}${fmt(sello.actual)}</b></span>`
      : `<span class="precio">${desde!=null?`<small>Desde</small><b>${fmt(desde)}</b>`:'<small>Precio</small><b>Consultar</b>'}</span>`;
    const ptsHtml = pts ? `<span class="card-pts">🎁 +${pts} pts</span>` : '';
    return `<button class="card ${agotado(p)?'agotado':''} ${p.destacado?'card-dest':''}" data-id="${p.id}">
      ${p.destacado ? '<span class="badge-dest">★ Destacado</span>' : ''}
      ${off ? `<span class="badge-off">−${off}%</span>` : ''}
      <div class="imgwrap">${main ? `<img src="${esc(main)}" alt="${esc(p.nombre)}" loading="lazy">` : `<span class="ph">${esc((p.marca||p.nombre||'?')[0])}</span>`}</div>
      <div class="body">
        <span class="marca">${esc(p.marca||'')}</span>
        <span class="nombre">${esc(p.nombre)}</span>
        ${stockLine(p)}
        <div class="foot">
          <div class="foot-price">${precioHtml}${ptsHtml}</div>
          <span class="ver">→</span>
        </div>
      </div>
    </button>`;
  }).join('');
  document.querySelectorAll('.card').forEach(c => c.onclick = () => openProduct(c.dataset.id));
}

let selSize=null, curProduct=null, prodQty=1;
function _tieneKw(txt,kws){ const t=String(txt||'').toLowerCase(); return kws.some(k=>t.includes(k)); }
/* ===== Perfil olfativo: barras visuales ===== */
function longevidadFrac(txt){
  const m=String(txt||'').match(/\d+(\.\d+)?/g);
  if(!m){ const t=String(txt||'').toLowerCase();
    if(/eterna|muy larga|larguísima/.test(t)) return 1;
    if(/larga|alta|excelente/.test(t)) return .8;
    if(/moderada|media/.test(t)) return .55;
    if(/baja|corta|poca/.test(t)) return .3; return .5; }
  const nums=m.map(Number); const h=nums.reduce((a,b)=>a+b,0)/nums.length;
  return Math.max(.12, Math.min(1, h/12));   // 12h = barra llena
}
function estelaFrac(txt){
  const t=String(txt||'').toLowerCase();
  const map=[['muy fuerte',1],['bestial',1],['enorme',1],['intensa',.95],['fuerte',.9],['envolvente',.9],['moderada-alta',.7],['moderada alta',.7],['alta',.85],['moderada',.5],['media',.5],['ligera',.3],['suave',.28],['íntima',.22],['intima',.22],['baja',.28],['cercana',.25],['discreta',.3]];
  for(const [k,v] of map){ if(t.includes(k)) return v; }
  return .5;
}

function _toRgbArr(c){
  c=(c||'').trim();

    const nums=m[1].split(',').map(s=>parseFloat(s));
    return [nums[0]||0, nums[1]||0, nums[2]||0, nums[3]!=null?nums[3]:1];
  }
  if(m=c.match(/^#([0-9a-fA-F]{3,8})$/)){
    let h=m[1]; if(h.length===3||h.length===4) h=h.split('').map(x=>x+x).join('');
    const r=parseInt(h.slice(0,2),16), g=parseInt(h.slice(2,4),16), b=parseInt(h.slice(4,6),16);

function _browserResolveColor(colorStr){
  try{
    const probe=document.createElement('span');
    probe.style.cssText='position:fixed; left:-9999px; top:0; visibility:hidden;';
    document.body.appendChild(probe);
    probe.style.color=colorStr;
    const resolved=getComputedStyle(probe).color;
    document.body.removeChild(probe);

  }catch(e){}

function _mixColorMixString(full){
  const viaBrowser=_browserResolveColor(full);

    const inner=full.slice(full.indexOf('(')+1, full.lastIndexOf(')'));
    const body=inner.replace(/^in\s+[\w-]+\s*,\s*/i,'');
    // separar por comas de nivel superior (no dentro de paréntesis)
    const parts=[]; let depth=0, cur='';
    for(const ch of body){ if(ch==='(') depth++; if(ch===')') depth--; if(ch===',' && depth===0){ parts.push(cur); cur=''; } else cur+=ch; }

    let c1=parseP(parts[0]), c2=parseP(parts[1]);
    if(c1.pct==null && c2.pct==null){ c1.pct=50; c2.pct=50; }
    else if(c1.pct==null) c1.pct=100-c2.pct;
    else if(c2.pct==null) c2.pct=100-c1.pct;
    const rgb1=_toRgbArr(c1.color), rgb2=_toRgbArr(c2.color);

function _resolveColorMixInString(str){
  let out=''; let i=0;
  while(i<str.length){
    const idx=str.indexOf('color-mix(', i);
    if(idx===-1){ out+=str.slice(i); break; }
    out+=str.slice(i, idx);
    const openParen=idx+'color-mix'.length;
    let depth=0, j=openParen;
    for(; j<str.length; j++){ if(str[j]==='(') depth++; else if(str[j]===')'){ depth--; if(depth===0) break; } }
    const full=str.slice(idx, j+1);
    const mixed=_mixColorMixString(full);
    out += mixed || 'rgba(120,120,120,1)';
    i=j+1;
  }
  return out;

function _porqueItems(txt){
  let s=String(txt||'').trim(); if(!s) return [];
  let segs = s.split(/\s*;\s*|\n+/).map(x=>x.trim()).filter(Boolean);
  if(segs.length<=1){ const parts=s.split(/(?=\*[^*]+\*)/).map(x=>x.trim()).filter(Boolean); if(parts.length>1) segs=parts; }
  return segs.map(seg=>{ const m=seg.match(/^\*([^*]+)\*\s*(.*)$/); if(m) return {nombre:m[1].trim(), txt:m[2].replace(/^[:\-–—]\s*/,'').trim()}; return {nombre:'', txt:seg.replace(/\*/g,'')}; });
}

function _comboPuntos(combo, ml){
  const rc=CONFIG.REGALO_COMBO; if(!rc||rc.activo===false) return {pts:0,n:0};
  const pdef=rc.puntos||{}; const inc=Array.isArray(combo.incluye)?combo.incluye:[];
  let pts=0, n=0;
  inc.forEach(nm=>{ const p=_comboFindProd(nm); const cat=p?p.categoria:null; const v=cat?((pdef[cat]||{})[String(ml)]):null; if(v!=null){ pts+=Number(v); n++; } });
  if(pts===0 && inc.length){ const anyCat=Object.keys(pdef)[0]; const v=anyCat?((pdef[anyCat]||{})[String(ml)]):null; if(v!=null){ pts=Number(v)*inc.length; n=inc.length; } }
  return {pts, n:n||inc.length};
}

function addToCart(){
  if(!curProduct || !selSize) return;
  const q = Math.max(1, prodQty||1);
  const st = (selSize.stock!=null) ? selSize.stock : stockDe(curProduct);
  const key = curProduct.id + '_' + selSize.size;
  const yaKey = (CART.find(i=>i.key===key)||{}).qty || 0;
  if(st!=null && (yaKey+q) > st){ toast(st<=0?'Talla agotada':'No hay suficiente stock de esa talla'); return; }
  const found = CART.find(i=>i.key===key);
  if(found) found.qty += q;
  else CART.push({ key, id:curProduct.id, nombre:curProduct.nombre, marca:curProduct.marca, categoria:curProduct.categoria, img:imgsOf(curProduct)[0], ml:selSize.size, precio:selSize.price, precio_may:selSize.may||0, qty:q });
  saveCart();
  const rcOn = CONFIG.REGALO_COMBO && CONFIG.REGALO_COMBO.activo!==false;
  let ptsGanados=null;
  if(rcOn){
    if(_esSellado(selSize.size)) ptsGanados=_selloPtsFor(curProduct.categoria)*q;
    else { const pd=(CONFIG.REGALO_COMBO.puntos||{})[curProduct.categoria]||{}; const v=pd[String(selSize.size)]; ptsGanados = v!=null?Number(v)*q:null; }
  }
  const rc = rcOn ? regaloComboEstado() : null;
  if(regaloDisponible()) toast('🎁 ¡Ganaste un regalo! Elígelo en tu pedido');
  else if(rc && rc.disponibles.length) toast(`✅ Añadido${ptsGanados?` (+${ptsGanados} pts)`:''} · 🎁 ¡Ya puedes elegir tu premio!`);
  else if(rc && rc.pts>0 && rc.siguiente) toast(`✅ Añadido${ptsGanados?` (+${ptsGanados} pts)`:''} · Te faltan ${Number(rc.siguiente.meta)-rc.pts} pts para tu premio`);
  else toast(`Añadido: ${curProduct.nombre} (${mlLabel(selSize.size)}) x${q}`);
  closeProduct(); openCart();
}

/* Regalo por COMBO: puntos por talla; cada meta puntos = 1 regalo (2ml gratis). Mezcla = suma de puntos. */
function regaloComboEstado(){
  const cfg=CONFIG.REGALO_COMBO||{};
  if(cfg.activo===false) return {activo:false, pts:0, disponible:0, tiers:[], disponibles:[], siguiente:null, faltan:0};
  const puntos=cfg.puntos||{};
  const tiers=regaloTiers();
  let pts=0, nd=0;
  CART.forEach(i=>{ if(i.tipo==='regalo'||i.tipo==='addon') return;
    if(i.tipo==='combo'){ if(i.comboPts){ pts+=Number(i.comboPts)*(i.qty||1); nd+=(Number(i._comboN)||1)*(i.qty||1); } return; }
    if(String(i.ml||'').toLowerCase()==='sellado'){ pts+=_selloPtsFor(i.categoria)*(i.qty||1); nd+=(i.qty||1); return; }
    const v=(puntos[i.categoria]||{})[String(i.ml)]; if(v==null) return; pts+=v*(i.qty||1); nd+=(i.qty||1);
  });
  const chosenLines=CART.filter(i=>i.tipo==='regalo'&&i.promoId==='__comboregalo__');
  const consumed=chosenLines.reduce((s,i)=>s+(Number(i._tierMeta)||0),0);
  const disponible=Math.max(0, pts-consumed);
  const disponibles=tiers.filter(t=>disponible>=Number(t.meta));
  const siguiente=tiers.find(t=>disponible<Number(t.meta)) || null;
  const faltan=siguiente ? (Number(siguiente.meta)-disponible) : 0;
  const avg = nd>0 ? pts/nd : 20;
  const faltanDecants = faltan>0 ? Math.max(1, Math.ceil(faltan/(avg||20))) : 0;
  return { activo:true, pts, disponible, tiers, disponibles, siguiente, faltan, faltanDecants, chosen:chosenLines.length,
    // compat con código viejo:
    meta: tiers[0] ? Number(tiers[0].meta) : 60, gml: tiers[0] ? tiers[0].ml : '2', remaining: faltan,
    porElegir: disponibles.length ? 1 : 0,
    opciones: disponibles.length ? (PRODUCTS||[]).filter(p=>p.regalo_permitido && p.visible!==false && (!disponibles[disponibles.length-1].categoria || p.categoria===disponibles[disponibles.length-1].categoria)).map(p=>({id:p.id,nombre:p.nombre,img:imgsOf(p)[0]||''})) : []
  };
}
function _tierOpciones(tier){ return (PRODUCTS||[]).filter(p=>p.regalo_permitido && p.visible!==false && (!tier.categoria || p.categoria===tier.categoria)).map(p=>({id:p.id,nombre:p.nombre,img:imgsOf(p)[0]||''})); }
function addGiftCombo(tierMeta, pid){
  // Compat: si se llama con un solo argumento (versión antigua), es el id del producto y usamos el nivel más alto disponible.
  if(pid==null){ pid=tierMeta; const st0=regaloComboEstado(); const t0=st0.disponibles[st0.disponibles.length-1]; tierMeta=t0?t0.meta:null; }
  const st=regaloComboEstado();
  const tier=st.tiers.find(t=>Number(t.meta)===Number(tierMeta));
  if(!tier || st.disponible<Number(tier.meta)){ toast('Aún no tienes suficientes puntos para ese premio'); return; }
  const p=PROD_BY_ID[pid]; if(!p){ toast('Elige un perfume'); return; }
  CART.push({ key:'regalo___combo___'+pid+'_'+Date.now(), id:pid, tipo:'regalo', promoId:'__comboregalo__', nombre:p.nombre, marca:'Regalo', img:imgsOf(p)[0]||'', ml:tier.ml, precio:0, qty:1, _tierMeta:Number(tier.meta) });
  saveCart(); toast('🎁 ¡Regalo agregado!');
}

/* ¿Hay un regalo recién disponible para elegir? */
function regaloDisponible(){
  return (GIFT_STATUS||[]).some(g=>{

  });
}

function _actualizarContadoresPuntos(){
  const badge=$('#cartPtsBadge'); const counter=$('#cartPtsCounter');
  const rcOn = CONFIG.REGALO_COMBO && CONFIG.REGALO_COMBO.activo!==false;
  if(!rcOn || !CART.length){ if(badge) badge.style.display='none'; if(counter) counter.style.display='none'; return; }
  const rc=regaloComboEstado();
  if(badge){
    if(rc.pts>0){ badge.textContent='🎁 '+rc.pts; badge.style.display='block'; }
    else badge.style.display='none';
  }
  if(counter){
    if(rc.disponibles.length){ const top=rc.disponibles[rc.disponibles.length-1];
      counter.innerHTML=`<div class="cart-pts-counter unlocked">🎁 <b>${rc.pts} pts</b> · ¡Ya puedes elegir ${esc((top.label||'tu premio').toLowerCase())}!</div>`;
    } else if(rc.pts>0 && rc.siguiente){
      counter.innerHTML=`<div class="cart-pts-counter">🎁 <b>${rc.pts} pts</b> · Te faltan <b>${Number(rc.siguiente.meta)-rc.pts} pts</b> para ${esc(rc.siguiente.label||'tu premio')}</div>`;

    } else { counter.style.display='none'; return; }
    counter.style.display='block';
  }
}
function renderCart(){
  const n = CART.reduce((s,i)=>s+i.qty,0);
  const cc=$('#cartCount'); cc.textContent=n; cc.style.display=n?'grid':'none';
  _actualizarContadoresPuntos();

  if(!CART.length){
    $('#cartList').innerHTML = `<div class="cart-empty"><b style="font-family:'Cormorant Garamond',serif;font-size:1.3rem;color:var(--cream)">Tu pedido está vacío</b><br>Añade tus fragancias favoritas.</div>`;
    $('#cartBot').style.display='none'; GIFT_STATUS=[]; return;
  }

  let R = window.PROMOS_ENGINE.computeCart(pricedCart(), PROD_BY_ID, PROMOS);
  // Reconciliar regalos: nunca más regalos de los ganados (si bajan los requisitos, se quitan)
  let giftChanged=false;
  (R.regalos||[]).forEach(g=>{
    const gifts = CART.filter(i=>i.tipo==='regalo'&&i.promoId===g.promoId);
    if(gifts.length > g.giftsEarned){
      const sobra = new Set(gifts.slice(g.giftsEarned));
      CART = CART.filter(i=>!sobra.has(i));
      giftChanged=true;
    }
  });
  if(giftChanged){ localStorage.setItem('cart_'+CONFIG.TIENDA_NOMBRE, JSON.stringify(CART)); R = window.PROMOS_ENGINE.computeCart(pricedCart(), PROD_BY_ID, PROMOS); }
  GIFT_STATUS = R.regalos || [];

  // Regalo por combo (puntos por talla): si ya no alcanzan los puntos (p.ej. el cliente quitó productos), se quita el regalo más reciente hasta que cuadre.
  let rce = regaloComboEstado();
  if(rce.activo && rce.disponible<0){
    let guard=0, removed=false;
    while(rce.disponible<0 && guard<20){
      const chosenLines=CART.filter(i=>i.tipo==='regalo'&&i.promoId==='__comboregalo__');
      const last=chosenLines[chosenLines.length-1];
      if(!last) break;
      CART=CART.filter(i=>i!==last); removed=true;
      rce=regaloComboEstado(); guard++;
    }
    if(removed){ saveCart(); R = window.PROMOS_ENGINE.computeCart(pricedCart(), PROD_BY_ID, PROMOS); }
  }

  const lineHtml = (i) => {
    if(i.tipo==='regalo'){

          <div class="m">${i.ml?esc(mlLabel(i.ml)):''} · GRATIS</div>
        </div>
        <button class="rm" data-rm="${i.key}">Quitar</button>
      </div>`;
    }
    return `<div class="ci">
      <div class="th">${i.img?`<img src="${esc(i.img)}" alt="">`:''}</div>
      <div class="info">
        <div class="n">${esc(i.nombre)}</div>
        <div class="m">${esc(i.marca||'')} · ${mlLabel(i.ml)}</div>

        <div class="qty"><button data-dec="${i.key}">−</button><input class="qv" type="number" min="1" inputmode="numeric" data-qset="${i.key}" value="${i.qty}"><button data-inc="${i.key}">+</button></div>
      </div>
      <button class="rm" data-rm="${i.key}">Quitar</button>

  };
  const comboLines = R.lines.filter(l=>l.enCombo);
  const restLines  = R.lines.filter(l=>!l.enCombo);

  if(comboLines.length){

            ${ops.length
              ? `<div class="gift-row"><select id="comboGiftSel_${t.meta}">${ops.map(o=>`<option value="${esc(o.id)}">${esc(o.nombre)}</option>`).join('')}</select><button data-gift-tier="${t.meta}">Agregar</button></div>`
              : `<div class="gift-empty">Admin: marca perfumes de "${esc(t.categoria||'cualquier categoría')}" como "permitido para regalo".</div>`}
          </div>`;
        }).join('')}
        ${rc.faltan>0?`<div class="gift-falta">🛍️ Te faltan <b>${rc.faltan} puntos</b> para ${esc(rc.siguiente.label||'el siguiente premio')}</div>`:''}
      </div>`;
    } else if(rc.pts>0 && rc.faltan>0){
      comboGiftHtml=`<div class="aviso-vibe">🎁 Llevas <b>${rc.pts} pts</b> · Te faltan <b>${rc.faltan} puntos</b> para ${esc(rc.siguiente?rc.siguiente.label:'tu premio')} GRATIS</div>`;

function chgQty(key,d){ const i=CART.find(x=>x.key===key); if(!i)return;
  if(d>0){ const p=PROD_BY_ID[i.id]; const s=p?stockDe(p):null; if(s!=null && qtyEnCarrito(i.id)>=s){ toast('No hay más stock disponible'); return; } }
  i.qty+=d; if(i.qty<1)CART=CART.filter(x=>x.key!==key); saveCart(); }
function setQty(key,val){ const i=CART.find(x=>x.key===key); if(!i)return;
  let v=parseInt((''+val).replace(/[^\d]/g,''),10); if(isNaN(v)||v<1)v=1;
  const p=PROD_BY_ID[i.id]; const s=p?stockDe(p):null;
  if(s!=null){ const otros=qtyEnCarrito(i.id)-i.qty; if(otros+v>s){ v=Math.max(1,s-otros); toast('Ajustado al stock disponible'); } }
  i.qty=v; saveCart(); }

      <div class="cb-sep"></div>
      ${R.lines.map(i=>`<div class="cb-row"><span>${esc(i.nombre)} · ${esc(mlLabel(i.ml))} ×${i.qty}</span><b>${i.tipo==='regalo'?'GRATIS':fmt(i.unit*i.qty)}</b></div>`).join('')}
      ${R.ahorro>0?`<div class="cb-row desc"><span>Descuento</span><b>- ${fmt(R.ahorro)}</b></div>`:''}
      ${emp>0?`<div class="cb-row"><span>Empaquetado</span><b>${fmt(emp)}</b></div>`:''}
      <div class="cb-sep"></div>
      <div class="cb-row tot"><span>TOTAL</span><b>${fmt(total)}</b></div>
      <div class="cb-row"><span>Pago</span><b>Yape/Plin · Op. ${esc(p.op||'-')}</b></div>
    </div>
    <div class="co-nav"><button class="co-b ghost" id="co_back">← Atrás</button><button class="co-b wa2" id="co_send">💬 Enviar pedido por WhatsApp</button></div>
  `;
  $('#co_back').onclick=()=>{ CO.step=1; renderCheckout(); };
  $('#co_send').onclick=()=>coFinalizar();
}
async function coFinalizar(){
  const R=CO.R, c=CO.cli, p=CO.pago; const {emp,total}=_coEmp(R); const enc=s=>encodeURIComponent(s);
  const envTxt = c.courier==='ica'?'Cliente en Ica': (c.courier==='shalom_domicilio'?'Shalom a domicilio':'Shalom recojo en agencia');
  // Guardar venta
  try{
    const items=R.lines.map(i=>({id:i.id,nombre:i.nombre,marca:i.marca||'',categoria:i.categoria||(PROD_BY_ID[i.id]?PROD_BY_ID[i.id].categoria:null),ml:i.ml,qty:i.qty,precio:i.unit,total:i.unit*i.qty,tipo:i.tipo||'normal'}));
    await sb.from('ventas').insert({
      cliente_nombre:c.nombre||null, cliente_telefono:c.tel||null,
      cliente_direccion:(c.agencia_dir?`Ag. Shalom: ${c.agencia_dir} — ${c.dist||''}, ${c.prov||''}, ${c.dep||''}`:envTxt),
      items, subtotal:R.totalSinDesc, descuento:R.ahorro, total:total,
      metodo_pago:'yape', yape_operacion:p.op||null, estado:'nuevo',
      cliente_codigo:(window.MI_CUENTA&&MI_CUENTA.codigo)||null,
      data:{ correo:c.correo||'', tipo_doc:c.tipoDoc||'', documento:c.doc||'', courier:c.courier, departamento:c.dep||'', provincia:c.prov||'', distrito:c.dist||'', agencia_dir:c.agencia_dir||'', empaque:emp, comprobante:p.comprobante||'' }
    });
  }catch(e){ console.warn('No se registró la venta:', e); }
  // WhatsApp
  let msg=`¡Hola ${enc(CONFIG.TIENDA_NOMBRE)}! Confirmo mi pedido:%0A%0A`;
  R.lines.forEach(i=>{ msg += (i.tipo==='regalo')?`• 🎁 ${enc(i.nombre)} — ${enc(mlLabel(i.ml))} x${i.qty} = GRATIS%0A`:`• ${enc(i.nombre)} — ${enc(mlLabel(i.ml))} x${i.qty} = ${enc(fmt(i.unit*i.qty))}%0A`; });
  if(R.ahorro>0) msg+=`%0A🎉 Ahorro: ${enc(fmt(R.ahorro))}`;
  if(emp>0) msg+=`%0AEmpaquetado: ${enc(fmt(emp))}`;
  msg+=`%0A*Total: ${enc(fmt(total))}*`;
  msg+=`%0A%0A👤 *Datos:*%0ANombre: ${enc(c.nombre||'')}%0A${c.tipoDoc||'Doc'}: ${enc(c.doc||'-')}%0ATel: ${enc(c.tel||'-')}%0A${c.correo?`Correo: ${enc(c.correo)}%0A`:''}`;
  msg+=`%0A📦 Entrega: ${enc(envTxt)}`;
  if(c.agencia_dir) msg+=`%0AAgencia Shalom: ${enc(c.agencia_dir)}%0AUbicación: ${enc((c.dist||'')+', '+(c.prov||'')+', '+(c.dep||''))}`;
  msg+=`%0A%0A💜 Pago Yape/Plin · N° op: ${enc(p.op||'-')}`;
  if(p.comprobante) msg+=`%0AComprobante: ${enc(p.comprobante)}`;
  window.open(`https://wa.me/${CONFIG.WHATSAPP}?text=${msg}`,'_blank');
  toast('✅ ¡Pedido enviado!');
  closeCheckout();
}
function _itemsParaVenta(R){
  return R.lines.map(i=>{
    const base={ id:i.id, nombre:i.nombre, marca:i.marca||'', categoria:i.categoria||(PROD_BY_ID[i.id]?PROD_BY_ID[i.id].categoria:null), ml:i.ml, qty:i.qty, precio:i.unit, total:i.lineTotal, tipo:i.tipo||'normal' };
    if(i.tipo==='regalo' && i._tierMeta) base.tierMeta=Number(i._tierMeta);
    return base;
  });
}
function _empaqueDe(R){
  const empCfg=CONFIG.EMPAQUE||{activo:true,monto:5,gratis_desde:200};
  const envioTipo=cliente.envio||'ica';
  const gratisDesde=Number(empCfg.gratis_desde||(CONFIG.COMBO_ARMA&&CONFIG.COMBO_ARMA.envio_gratis_desde)||200);
  const emp=(empCfg.activo!==false && envioTipo==='shalom' && R.total<gratisDesde)?Number(empCfg.monto||5):0;
  return { envioTipo, emp, total:R.total+emp };
}
async function _guardarVenta(R){
  const nombre=(cliente.nombre||'').trim(), tel=(cliente.tel||'').trim();
  const {envioTipo, emp, total}=_empaqueDe(R);
  const items=_itemsParaVenta(R);
  await sb.from('ventas').insert({
    cliente_nombre:nombre||null, cliente_telefono:tel||null,
    cliente_direccion: envioTipo==='shalom' ? 'Envío Shalom' : 'Cliente en Ica',
    items, subtotal:R.totalSinDesc, descuento:R.ahorro, total,
    metodo_pago:'coordinar', estado:'nuevo',
    cliente_codigo:(window.MI_CUENTA&&MI_CUENTA.codigo)||null,
    data:{ envio:envioTipo, empaque:emp }
  });
}
async function registrarPedido(R){
  if(!CART.length){ toast('Tu pedido está vacío'); return; }
  const nombre=(cliente.nombre||'').trim(), tel=(cliente.tel||'').trim();
  if(!nombre||!tel){ toast('Escribe tu nombre y celular',true); return; }
  const btn=$('#registrarBtn'); if(btn){ btn.disabled=true; btn.textContent='Registrando…'; }
  try{
    await _guardarVenta(R);
    CART=[]; saveCart(); cartFullMode=false;
    toast('✅ ¡Pedido registrado! Te confirmaremos pronto.');
    closeCart();
  }catch(e){
    console.warn('No se pudo registrar el pedido:', e);
    toast('No se pudo registrar el pedido. Intenta de nuevo.',true);
    if(btn){ btn.disabled=false; btn.textContent='📝 Registrar pedido'; }
  }
}
async function checkout(R){
  if(!CART.length){ toast('Tu pedido está vacío'); return; }
  const nombre=(cliente.nombre||'').trim(), tel=(cliente.tel||'').trim();
  const enc = s => encodeURIComponent(s);

  // Registrar la venta (no bloquea el pedido si falla)
  try{ await _guardarVenta(R); }catch(e){ console.warn('No se pudo registrar la venta:', e); }

  // Armar mensaje de WhatsApp
  let msg = `¡Hola ${enc(CONFIG.TIENDA_NOMBRE)}! Quiero hacer este pedido:%0A%0A`;
  R.lines.forEach(i => {
    if(i.tipo==='regalo') msg += `• 🎁 ${enc(i.nombre)} — ${enc(mlLabel(i.ml))} x${i.qty} = GRATIS%0A`;
    else msg += `• ${enc(i.nombre)} (${enc(i.marca||'')}) — ${enc(mlLabel(i.ml))} x${i.qty} = ${enc(fmt(i.unit*i.qty))}%0A`;
  });
  if(R.ahorro>0) msg += `%0A🎉 Ahorro: ${enc(fmt(R.ahorro))}`;
  const {envioTipo, emp, total:totalFinal}=_empaqueDe(R);
  msg += `%0A%0A📦 Entrega: ${envioTipo==='shalom'?'Envío Shalom':'Cliente en Ica'}`;
  if(emp>0) msg += `%0AEmpaquetado: ${enc(fmt(emp))}`;
  msg += `%0A*Total: ${enc(fmt(totalFinal))}*`;
  if(nombre||tel){
    msg += `%0A%0A👤 *Mis datos:*%0A${nombre?`Nombre: ${enc(nombre)}%0A`:''}${tel?`Teléfono: ${enc(tel)}`:''}`;
  }
  window.open(`https://wa.me/${CONFIG.WHATSAPP}?text=${msg}`, '_blank');
}

  if(currentView==='promos') renderCombos();
  else if(currentView==='preorden') renderPre();
  else if(currentView==='consolidado') renderCon();
  else render();
};
const _be=$('#btnEstado'); if(_be) _be.onclick = abrirConsulta;
document.addEventListener('keydown', e => { if(e.key==='Escape'){ closeProduct(); closeCart(); } });

/* ================= Pestañas Catálogo / Promociones ================= */
document.querySelectorAll('#viewtabs .vtab').forEach(b => b.onclick = () => setView(b.dataset.view));

let toastT; function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2400); }

renderCart();
load().finally(()=>setTimeout(()=>{ const l=$('#loader'); if(l) l.classList.add('hide'); }, 450));
</script>
